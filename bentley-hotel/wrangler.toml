# Cloudflare Pages project for the Bentley Hotel website.
# Static files live in public/; functions/ holds the edge code (public router, admin, availability API).
#
# Secrets (Pages → Settings → Variables and Secrets; never put them in this file):
#   ADMIN_PASSWORD or ADMIN_PASSWORD_HASH   admin login (make a hash with: node src/hash-password.js)
#   SESSION_SECRET                          a long random string for signing admin sessions
#   CLOUDBEDS_API_KEY                       Cloudbeds property API key (read:rate for the calendar; read:reservation and
#                                           the webhook scopes for the bookings register)
#   CLOUDBEDS_WEBHOOK_SECRET                any long random string; Cloudbeds sends it back in X-Webhook-Secret
#   GA4_API_SECRET                          GA4 Measurement Protocol API secret (Admin → Data streams → Measurement Protocol)
#   SYNC_SECRET                             any long random string; lets a scheduler call /api/cloudbeds/sync?key=…
# A nightly sync on Cloudflare: add a Cron Trigger that fetches https://<site>/api/cloudbeds/sync with the X-Sync-Key
# header, or rely on webhooks alone (the admin's Bookings → Sync now button works at any time).
name = "bentley-hotel"
pages_build_output_dir = "public"
compatibility_date = "2025-10-01"

[vars]
CLOUDBEDS_PROPERTY_ID = "141393122377981"

# Content database (D1). Create it, then put the id here and apply the schema:
#   npx wrangler d1 create bentley-hotel
#   npx wrangler d1 execute bentley-hotel --remote --file functions/_lib/schema.sql
# Until this binding exists the site serves the static export in public/ and /admin reports "not configured".
#[[d1_databases]]
#binding = "DB"
#database_name = "bentley-hotel"
#database_id = "PASTE-THE-ID-FROM-wrangler-d1-create"

# Uploads (R2):  npx wrangler r2 bucket create bentley-hotel-media
#[[r2_buckets]]
#binding = "MEDIA"
#bucket_name = "bentley-hotel-media"
